<!DOCTYPE html>
<html>
  <head>
    <script type="text/javascript">
      // Capture the current URL path
      var redirectTo = window.location.pathname;
      // Store the current URL path in session storage
      sessionStorage.setItem('lastVisitedPage', redirectTo);
      // Navigate to the root page
      window.location.replace("/");
    </script>
  </head>
  <body>
  </body>
</html>
